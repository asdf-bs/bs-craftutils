<a class="skip-link" href="#main-content">Skip to main content</a>
<div class="app-shell" [attr.data-theme]="theme">
  <aside class="sidebar">
    <nav aria-label="Primary navigation">
      <a class="nav-item" routerLink="/alchemy" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page"><span class="nav-icon" aria-hidden="true">⚗</span><span class="nav-label">Alchemy<small>Herb notebook</small></span><span class="nav-arrow" aria-hidden="true">›</span></a>
      <a class="nav-item" routerLink="/resources" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page"><span class="nav-icon" aria-hidden="true">⌖</span><span class="nav-label">Resources<small>Field discoveries</small></span><span class="nav-arrow" aria-hidden="true">›</span></a>
      <div class="nav-item muted"><span class="nav-icon" aria-hidden="true">⚒</span><span>Crafting<small>Coming later</small></span><span class="soon">SOON</span></div>
    </nav>
    <div class="theme-picker" role="group" aria-label="Theme">
      <button type="button" (click)="setTheme('system')" [attr.aria-pressed]="theme === 'system'" aria-label="System theme" title="System theme"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22h8M12 18v4"/></svg></button>
      <button type="button" (click)="setTheme('light')" [attr.aria-pressed]="theme === 'light'" aria-label="Light theme" title="Light theme"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button>
      <button type="button" (click)="setTheme('dark')" [attr.aria-pressed]="theme === 'dark'" aria-label="Dark theme" title="Dark theme"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg></button>
    </div>
  </aside>
  <main id="main-content" class="main-content" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
</div>
